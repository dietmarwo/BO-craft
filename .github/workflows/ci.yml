name: cpu
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      # The tested CPU pins (Torch from the PyTorch CPU index), then this package.
      - run: python -m pip install -r requirements-tested.txt pytest ruff build
      - run: python -m pip install -e '.[botorch,optuna,test]'
      - run: pytest -q
      - run: ruff check .
      - run: ruff format --check src tests benchmarks examples
      - name: Recorded evidence and the bounded benchmark smoke profile
        run: |
          python benchmarks/verify_evidence.py
          python benchmarks/campaign.py --output "$RUNNER_TEMP/smoke" --seeds 1
      - name: Benchmark protocol of 17 November - recorded scores and a panel smoke
        run: |
          python benchmarks/summarize.py --verify docs/evidence/plan-2026-11-17/*.jsonl.gz
          for arm in botorch optuna-gp; do
            python benchmarks/panel.py cell --protocol benchmarks/protocol-2026-11-17.json --set mixed-dev \
              --problem branin_cat --noise 0.1 --budget 12 --arm "$arm" --seed 0 > "$RUNNER_TEMP/$arm.json"
            python -c "import json, sys; r = json.load(open(sys.argv[1])); assert r['status'] == 'completed', r; assert r['rules']['model']['regret'] is not None" "$RUNNER_TEMP/$arm.json"
          done
      - run: python -m build
      - name: A minimal install imports neither Torch nor Optuna
        run: |
          python -m venv "$RUNNER_TEMP/minimal"
          "$RUNNER_TEMP/minimal/bin/pip" install dist/*.whl
          "$RUNNER_TEMP/minimal/bin/python" -c "import sys, bo_craft; assert not {'torch', 'optuna'} & set(sys.modules)"
          "$RUNNER_TEMP/minimal/bin/bo-craft" capabilities
  vizier:
    # The campaign Vizier study against a real in-process Vizier server
    # (in-memory database), with the optional `vizier` extra.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[vizier]' pytest
      - run: pytest -q tests/test_vizier.py -rs
      - name: The tests ran rather than skipped
        run: python -c "import vizier"
